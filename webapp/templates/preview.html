<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>预览 {{ name }}</title>
<style>
  body { font-family: Arial, sans-serif; margin: 16px; font-size: 12px; color: #222; }
  h2 { font-size: 13px; margin: 0 0 8px; color: #555; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #d0d7de; padding: 4px 8px; text-align: left; }
  th { background: #f6f8fa; font-weight: bold; }
  .meta { color: #666; font-size: 11px; margin-bottom: 8px; }
</style>
</head>
<body>
<h2>{{ name | e }}</h2>
<div class="meta">job <code>{{ job_id }}</code> · 共 {{ rows | length - 1 }} 行数据</div>
{% if rows %}
<table>
  <thead>
    <tr>
      {% for c in rows[0] %}
        <th>{{ c | e }}</th>
      {% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for row in rows[1:] %}
      <tr>
        {% for c in row %}
          <td>{{ c | e }}</td>
        {% endfor %}
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}
</body>
</html>
